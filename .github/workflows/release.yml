name: Release Go SDK

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify release tag and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          grep -Fq "## [${version}]" CHANGELOG.md
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          awk -v heading="## [${version}]" '
            $0 == heading || index($0, heading " - ") == 1 { in_release = 1; next }
            in_release && /^## / { exit }
            in_release { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./examples/...
      - name: Verify provider example module
        working-directory: examples/provider-auto
        run: go test ./...
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --title "Go SDK $RELEASE_TAG" --notes-file release-notes.md --verify-tag
