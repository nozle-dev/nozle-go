steps:
  - name: "golang:1.22-alpine"
    id: vet
    dir: nozle-go
    entrypoint: go
    args: ["vet", "./..."]

  - name: "golang:1.22-alpine"
    id: test
    dir: nozle-go
    waitFor: [vet]
    entrypoint: sh
    args:
      - -c
      - apk add --no-cache gcc musl-dev && CGO_ENABLED=1 go test -race -timeout 60s ./...

options:
  machineType: E2_MEDIUM
  logging: CLOUD_LOGGING_ONLY

timeout: 300s
